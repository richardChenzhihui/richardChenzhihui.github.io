impact_areas:
  - label: "Coding Agent 与自进化"
    title: "面向 Coding Agent 的模型自进化（RSI）"
    description: "基础模型后训练的自进化闭环：Agent 自行提出、执行并验证候选方案，经真实执行校验的轨迹成为下一轮训练信号——模型的提升不再等待新的人工标注。"
    proof: "智谱（Z.ai）—— Coding Agent RSI · 在职"
  - label: "Agentic 中期训练与后训练"
    title: "从 mid-training 到轨迹上的强化学习"
    description: "Agentic 中期训练先注入工具调用与长程执行能力，后训练再以奖励设计、偏好对齐（DPO/RLHF）与 RLVR 加以塑形。Farsight 将 RLVR 的信用分配从即时依赖扩展到未来折扣锚定。"
    proof: "Farsight（ICLR 2026 在投）· ACL 2026 主会议 · EMNLP 2026 主会议"
  - label: "验证器与 Agent 系统"
    title: "自进化的上限由验证器决定"
    description: "自进化 Agent 的质量取决于给它打分的验证器。DivScore 是带理论保证的零样本验证器；OfficeBuddy 将独立验证器放进闭环：计划 → 执行 → 真实渲染 → 审查 → 定向修复。"
    proof: "EMNLP 2025 主会议 · +14.4% AUROC · GitHub 53★"

