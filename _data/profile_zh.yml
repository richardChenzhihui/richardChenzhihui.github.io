short_bio_text_justify: false
short_bio: >-
  <p>
    新加坡国立大学人工智能博士生，导师为
    <a href="https://www.mornin-feng.com/" target="_blank">冯梦凌教授</a>。
  </p>
  <p>
    研究方向是 Coding Agent + RSI（递归自进化）的后训练：Agent 生成编码任务并在沙箱中求解，通过编译和测试的轨迹被保留，下一版模型在这些轨迹上训练。我关心的问题是长轨迹的信用分配、奖励与验证器设计，以及用独立于 Agent 的检查器审查其行动。同样的方法也用于医疗 Agent（<a href="https://github.com/richardChenzhihui/med-banana-50k" target="_blank">Med-Banana</a>）；另一部分工作是医学伪造图像与大模型生成文本的检测（<a href="https://github.com/richardChenzhihui/ACL2026-MedForge" target="_blank">MedForge</a>、<a href="https://github.com/richardChenzhihui/DivScore" target="_blank">DivScore</a>）。
  </p>
  <p>
    现于智谱（Z.ai）基础模型后训练团队实习，做 Coding Agent 后训练。此前在字节跳动（视觉语言模型的 Agent 强化学习，Farsight）和阶跃星辰（StepAudio2.5 预训练数据）实习。已获阿里通义实验室 Qwen 团队研究实习录用，并入选腾讯「青云计划」。
  </p>

hero_summary: >-
  新加坡国立大学博士生，研究 Coding Agent 后训练与递归自进化（RSI），应用于医疗 Agent 与医疗 AI 安全。

impact_areas:
  - label: "方向一 · Coding Agent + RSI"
    title: "基于执行验证轨迹的 Coding Agent 后训练"
    summary: >-
      Coding Agent 提出软件任务并在沙箱中求解；能编译、通过测试且可复现的轨迹保留为 SFT 与 RL 数据；更新后的模型进入下一轮。每一轮是否有效取决于筛选是否可靠，因此我的工作主要在筛选与训练信号上：长轨迹的信用分配、奖励与验证器设计，以及用 Agent 无法控制的检查器审查其行动。
  - label: "方向二 · 医疗 Agent 与医疗 AI 安全"
    title: "医疗 Agent 与医疗伪造内容检测"
    summary: >-
      医疗场景中检查一个输出往往需要医生，反馈少且贵。Med-Banana 把 RSI 用于医学图像编辑：验证器为每次编辑打分，反馈逐轮修正 Prompt，成功与失败的轨迹用于后训练。安全方面，MedForge 检测伪造的医学影像并指出伪造位置，DivScore 无需训练检测器即可识别医疗与法律领域的大模型生成文本。

