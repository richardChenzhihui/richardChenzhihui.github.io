short_bio: >-
  <p>
    新加坡国立大学人工智能博士生，导师为
    <a href="https://www.mornin-feng.com/" target="_blank">冯梦凌教授</a>。
  </p>
  <p>
    研究聚焦 Coding Agent 与递归自进化（RSI），以及基座模型后训练：探索如何将自主探索、代码执行与可验证反馈转化为可扩展的学习信号，推动模型推理与长程任务能力的持续提升。
  </p>
  <p>
    博士研究以 AI 递归自进化（RSI）为核心，同时研究医疗 Agent 与医疗 AI 安全，推动智能能力的进步与医疗、人类福祉的发展。
  </p>
  <p>
    现于智谱（Z.ai）基础模型后训练团队实习，以 RSI 驱动 Coding Agent 方向的大模型后训练；同时已获阿里通义 Qwen 基座模型实习与腾讯「青云计划」精英科研人才计划。
  </p>

