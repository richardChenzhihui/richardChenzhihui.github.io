short_bio_text_justify: false
short_bio: >-
  <p>
    新加坡国立大学人工智能博士生，导师为
    <a href="https://www.mornin-feng.com/" target="_blank">冯梦凌教授</a>。
  </p>
  <p>
    研究聚焦 Coding Agent 与大模型的自进化（RSI, recursive self-improvement）：通过 Agentic 中期训练（mid-training）与后训练闭环，让模型从自己生成、并经真实执行验证的轨迹中持续改进，而不依赖持续的人工标注。
  </p>
  <p>
    现于智谱（Z.ai）基础模型后训练团队实习，方向为 Coding Agent RSI 自进化；同时已获阿里通义 Qwen 基座模型实习与腾讯「青云计划」精英科研人才计划。
  </p>

