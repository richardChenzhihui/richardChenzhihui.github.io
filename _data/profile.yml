impact_areas:
  - label: "Coding Agents & RSI"
    title: "Recursive self-improvement for coding agents"
    description: "Foundation-model post-training in which the coding agent improves from its own execution: it proposes, runs and verifies candidate solutions, and the resulting execution-grounded trajectories become the next round of training signal — improvement without waiting for fresh human labels."
    proof: "Zhipu AI (Z.ai) — Coding Agent RSI · current"
  - label: "Agentic Mid- & Post-Training"
    title: "From mid-training to RL on agent trajectories"
    description: "Agentic mid-training injects tool-use and long-horizon execution behavior before alignment; post-training then shapes it with reward design, preference alignment (DPO/RLHF) and RLVR. Farsight extends RLVR credit assignment from instant to future-discounted grounding."
    proof: "Farsight (ICLR 2026 sub) · ACL 2026 Main · EMNLP 2026 Main"
  - label: "Verifiers & Agent Systems"
    title: "Verification is what makes self-improvement possible"
    description: "A self-improving agent is only as good as the verifier that scores it. DivScore is a zero-shot verifier with theoretical guarantees; OfficeBuddy puts an independent verifier in the loop — plan → act → real render → audit → targeted repair."
    proof: "EMNLP 2025 Main · +14.4% AUROC · 53★ on GitHub"

