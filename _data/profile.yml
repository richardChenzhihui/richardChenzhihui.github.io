short_bio_text_justify: false
short_bio: >-
  <p>
    I am a PhD student in Artificial Intelligence at the National University of Singapore, supervised by
    <a href="https://www.mornin-feng.com/" target="_blank">Prof. Mengling Feng</a>.
    My research centers on post-training for large (multimodal) language models &mdash; reward design, preference alignment (DPO/RLHF/RLVR), verifier-in-the-loop evaluation &mdash; and agent harnesses that hold up outside the lab. Healthcare is my primary application domain, not the boundary of my research.
  </p>
  <p>
    <strong>Research:</strong> ACL 2026, EMNLP 2026 &amp; EMNLP 2025 main-conference papers; ICLR 2026 first-author under review; 150K+ Hugging Face downloads (Med-Banana-80K 100K+, MedForge-90K 50K+).
  </p>
  <p>
    <strong>Open source:</strong> <a href="https://github.com/richardChenzhihui/OfficeBuddy" target="_blank">OfficeBuddy</a> &mdash; a 53&#9733; open-source Word/Excel agent that re-renders every edit through real Microsoft Office and audits it with an independent visual verifier.
  </p>
  <p>
    <strong>Academic service:</strong> Reviewer for top conferences (ACL / NeurIPS / IJCAI, 40+ reviews); ACL 2026 Session Chair.
  </p>

