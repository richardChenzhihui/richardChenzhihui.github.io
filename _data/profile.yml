short_bio_text_justify: false
short_bio: >-
  <p>
    I am a PhD student in Artificial Intelligence at the National University of Singapore, advised by
    <a href="https://www.mornin-feng.com/" target="_blank">Prof. Mengling Feng</a>.
  </p>
  <p>
    My research centers on recursive self-improvement (RSI): letting the model set its own tasks, solve them, and grade itself, so that verified experience becomes training data for the next model — each version helps build its successor. The loop runs on coding agents first, where sandboxed execution provides a verifiable signal, and is now extending to medical agents (<a href="https://github.com/richardChenzhihui/med-banana-50k" target="_blank">Med-Banana</a>). A second line of my work detects AI-generated medical images and text (<a href="https://github.com/richardChenzhihui/ACL2026-MedForge" target="_blank">MedForge</a>, <a href="https://github.com/richardChenzhihui/DivScore" target="_blank">DivScore</a>).
  </p>
  <p>
    I am currently a research intern on the foundation-model post-training team at Zhipu AI (Z.ai), working on coding-agent RSI post-training for the next-generation GLM foundation model. Previously I interned at ByteDance (VLM post-training; Farsight) and StepFun (StepAudio2.5 pre-training). I have received a research internship offer from the Qwen team at Alibaba Tongyi Lab, and was selected for Tencent&rsquo;s Qingyun Program.
  </p>

hero_summary: >-
  PhD student at NUS working on recursive self-improvement (RSI) — models that generate and verify their own training data — for coding and medical agents, currently post-training the next-generation GLM foundation model.

impact_areas:
  - label: "Direction 01 · Coding Agent + RSI"
    title: "Coding agents that generate their own training data"
    summary: >-
      Let the model set its own exam, sit it, and grade it: the agent proposes
      coding tasks and solves them in a sandbox, and verified experience becomes
      training data for the next model — capability compounds around this loop.
      Because execution is the grader, every step of self-improvement is checked
      against real results, making this the most direct and most measurable path
      toward models that improve themselves.
  - label: "Direction 02 · Medical Agents & Medical AI Safety"
    title: "Self-improving medical agents and medical content safety"
    summary: >-
      Medicine is the hardest and most worthwhile arena for RSI: feedback depends
      on clinicians, and errors carry real cost. Med-Banana lets a medical image
      editing agent improve itself against verifier feedback — successful and
      failed trajectories alike are recycled into training data, so editing
      capability compounds round by round. Safety completes the line: as models
      learn to generate realistic medical images and text, MedForge and DivScore
      are built to catch them.

