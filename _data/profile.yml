impact_areas:
  - label: "Primary Focus · Self-Improving Coding Agents"
    title: "Closing the loop of AI development."
    description: "Post-training for coding agents, where every action can be executed and checked. I work on the parts of the improvement loop that decide whether a gain is real: reward and verifier design, long-horizon credit assignment, and what is retained between rounds. The long-term goal is recursive self-improvement: AI that helps design, train and evaluate its successors."
    focus: "Coding Agents · Agentic Mid- & Post-Training · Verifiable RL"
    detail: "Execution-grounded rewards · verifiers independent of the proposer · long-horizon credit assignment · retention without regression."
    proof: "Zhipu AI · Farsight · Med-Banana (EMNLP 2026) · OfficeBuddy"
  - label: "Research Direction · AI for Healthcare"
    title: "Advance intelligence. Improve human lives."
    description: "In medicine, feedback is scarce, delayed and high-stakes, which makes it the hard case for any self-improving system. I study medical agents and medical AI safety: reliable reasoning, verifiable workflows, and the integrity of medical evidence."
    focus: "Medical Agents · Medical AI Safety"
    detail: "Med-Banana: verifier-guided iterative refinement for medical image editing, with success and failure trajectories retained for post-training. MedForge: interpretable detection of medical image forgery, so that corrupted evidence does not enter clinical or training pipelines."
    proof: "Med-Banana · EMNLP 2026 / MedForge · ACL 2026 Main"

