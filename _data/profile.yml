short_bio_text_justify: false
short_bio: >-
  <p>
    PhD student in Artificial Intelligence at the National University of Singapore, supervised by
    <a href="https://www.mornin-feng.com/" target="_blank">Prof. Mengling Feng</a>.
  </p>
  <p>
    My research focuses on coding-driven recursive self-improvement (RSI) for large language models: agentic mid-training and post-training loops in which coding agents generate, verify, and learn from their own execution trajectories instead of waiting for fresh human labels.
  </p>
  <p>
    I also work on AI for healthcare, bringing this verifiable, agentic post-training recipe to medical imaging &mdash; quality-controlled medical image editing and interpretable medical deepfake detection.
  </p>
  <p>
    I am currently a foundation-model post-training research intern at Zhipu AI (Z.ai), driving post-training with RSI for financial coding agents. I have also been selected for the Qwen foundation-model internship (Alibaba Tongyi) and for Tencent&rsquo;s Qingyun Elite Research Talent Program.
  </p>

