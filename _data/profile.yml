short_bio_text_justify: false
short_bio: >-
  <p>
    PhD student in Artificial Intelligence at the National University of Singapore, supervised by
    <a href="https://www.mornin-feng.com/" target="_blank">Prof. Mengling Feng</a>.
  </p>
  <p>
    I study how language-model agents improve themselves: how execution and verifiable feedback become training signal, what is retained between rounds, and what keeps the verifier honest. Coding agents are my testbed, where feedback is cheap and executable. Medicine is the counterpart, where feedback is scarce and high-stakes.
  </p>
  <p>
    The long-term aim is recursive self-improvement (RSI): systems that take part in building their successors.
  </p>
  <p>
    I am a post-training research intern at Zhipu AI (Z.ai), working on coding agents trained from execution-verified trajectories. I was also selected for the Qwen foundation-model internship (Alibaba Tongyi) and Tencent&rsquo;s Qingyun Program.
  </p>

