  - label: "Direction 02 · Medical Agents & Medical AI Safety"
    title: "Make self-improvement verifiable where feedback is costly: medicine."
    summary: >-
      Medicine is a setting where errors are costly and every check may face clinical
      review, so self-improvement there has to be verifiable. I work on two lines:
      medical agents — multimodal reasoning, tool use, and verifiable clinical workflows
      — and medical AI safety — image integrity, interpretable forgery detection, and
      rigorous evaluation of agent outputs.
    chain_caption:
      en: "The verified-feedback loop (Med-Banana)"
      zh: "可验证反馈循环（Med-Banana）"
    loop_note:
      en: "Verifier feedback drives recursive prompt self-improvement; success-and-failure trajectories then become post-training signal."
      zh: "验证反馈驱动 Prompt 递归自优化；成败轨迹再成为后训练信号。"
    steps:
