short_bio_text_justify: false
short_bio: >-
  <p>
    PhD student in Artificial Intelligence at the National University of Singapore, supervised by
    <a href="https://www.mornin-feng.com/" target="_blank">Prof. Mengling Feng</a>.
  </p>
  <p>
    My research direction is Coding Agent + RSI (recursive self-improvement): coding agents generate, execute and verify real coding tasks, and execution-verified trajectories become training signal for foundation-model post-training &mdash; stronger agents help build stronger models. The same line of work extends to medical agents and medical AI safety.
  </p>
  <p>
    I am currently a foundation-model post-training research intern at Zhipu AI (Z.ai), driving post-training with RSI for coding agents. I have also been selected for the Qwen foundation-model internship (Alibaba Tongyi) and for Tencent&rsquo;s Qingyun Elite Research Talent Program.
  </p>

hero_summary: >-
  My research direction is Coding Agent + RSI: building self-improving coding agents for foundation-model post-training, and applying the same methods to medical agents and medical AI safety.

impact_areas:
  - label: "Direction 01 · Coding Agents & Recursive Self-Improvement"
    title: "Stronger coding agents should help build stronger models."
    summary: >-
      I work on the training pipeline that turns agent execution into model progress:
      coding agents propose real software tasks and execute them in sandboxes; only
      trajectories that compile, pass tests, and reproduce are kept as post-training
      data; the updated model then runs a stronger agent in the next round. Whether the
      loop actually improves the model depends on three problems I study: long-horizon
      credit assignment, reward and verifier design, and independent auditing of agent
      actions.
    chain_caption:
      en: "The self-improvement loop"
      zh: "自改进循环"
    loop_note:
      en: "One verified round produces one model update; the loop works only if every step can be checked."
      zh: "每轮通过验证后更新一次模型；循环有效的前提是每一步都可检验。"
    steps:
      - en: "Agent proposes a real coding task"
        zh: "智能体生成真实编码任务"
      - en: "Sandbox execution"
        zh: "沙箱执行"
      - en: "Compile · test · replay"
        zh: "编译 · 测试 · 复现"
      - en: "Keep only verified trajectories"
        zh: "仅保留通过验证的轨迹"
      - en: "SFT · RL post-training"
        zh: "SFT · RL 后训练"
      - en: "Stronger model → stronger agent"
        zh: "更强模型 → 更强智能体"
    problems:
      - en: "Long-horizon credit assignment"
        zh: "长程任务的信用分配"
      - en: "Verifiable rewards (RLVR)"
        zh: "可验证奖励（RLVR）"
      - en: "Reward & verifier design"
        zh: "奖励与验证器设计"
      - en: "Independent audit of agent actions"
        zh: "智能体行动的独立审查"
