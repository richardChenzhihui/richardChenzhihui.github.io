  - label: "Direction 02 · Medical Agents & Medical AI Safety"
    title: "Medical agents and detection of forged medical content"
    summary: >-
      In medicine, checking an output often needs a clinician, so feedback is scarce and
      expensive. Med-Banana applies RSI to medical image editing: a verifier scores each
      edit, its feedback refines the prompt over rounds, and the successful and failed
      trajectories are used for post-training. On the safety side, MedForge detects
      forged medical images and explains where the forgery is, and DivScore detects
      LLM-generated medical and legal text without training a detector.
    chain_caption:
      en: "The verified-feedback loop (Med-Banana)"
      zh: "可验证反馈循环（Med-Banana）"
    loop_note:
      en: "Verifier feedback refines the prompt over rounds; successful and failed trajectories are then used for post-training."
      zh: "验证器反馈逐轮修正 Prompt；成功与失败的轨迹随后用于后训练。"
