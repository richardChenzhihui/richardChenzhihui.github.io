short_bio_text_justify: false
short_bio: >-
  <p>
    I am a PhD student in Artificial Intelligence at the National University of Singapore, advised by
    <a href="https://www.mornin-feng.com/" target="_blank">Prof. Mengling Feng</a>.
  </p>
  <p>
    I work on post-training for coding agents, focusing on recursive self-improvement (RSI): the agent generates coding tasks and solves them in a sandbox, trajectories that pass compilation and tests are kept, and the next model is trained on them. The questions I care about are credit assignment over long trajectories, reward and verifier design, and auditing agent actions with a checker independent of the agent. I also apply these methods to medical agents (<a href="https://github.com/richardChenzhihui/med-banana-50k" target="_blank">Med-Banana</a>), and work on detecting forged medical images and LLM-generated text (<a href="https://github.com/richardChenzhihui/ACL2026-MedForge" target="_blank">MedForge</a>, <a href="https://github.com/richardChenzhihui/DivScore" target="_blank">DivScore</a>).
  </p>
  <p>
    I am currently a research intern on the foundation-model post-training team at Zhipu AI (Z.ai), working on coding-agent RSI post-training for the next-generation GLM foundation model. Previously I interned at ByteDance (VLM post-training; Farsight) and StepFun (StepAudio2.5 pre-training). I have received a research internship offer from the Qwen team at Alibaba Tongyi Lab, and was selected for Tencent&rsquo;s Qingyun Program.
  </p>

hero_summary: >-
  PhD student at NUS working on coding-agent post-training and recursive self-improvement (RSI) for the next-generation GLM foundation model, with applications to medical agents and medical AI safety.

impact_areas:
  - label: "Direction 01 · Coding Agent + RSI"
    title: "Post-training coding agents on execution-verified trajectories"
    summary: >-
      A coding agent proposes software tasks and solves them in a sandbox. Trajectories
      that compile and pass the tests are kept as SFT and RL data, and the updated model
      runs the agent in the next round. The loop only helps if the filter is reliable, so
      my work centers on the training signal: credit assignment over long trajectories,
      reward and verifier design, and auditing agent actions with a checker independent
      of the agent.
    chain_caption:
      en: "The self-improvement loop"
      zh: "自改进循环"
    loop_note:
      en: "One round = one model update, trained only on trajectories that passed verification."
      zh: "一轮对应一次模型更新，训练数据只取通过验证的轨迹。"
    steps:
