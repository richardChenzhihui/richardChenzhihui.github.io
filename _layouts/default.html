<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} - {{ site.data.profile.navbar_name }}</title>
    <meta name="description" content="{{ site.data.profile.primary_name }} — {{ site.data.profile.hero_summary | strip_newlines | strip }}">
    <meta name="theme-color" content="#ffffff">
    <meta property="og:title" content="{{ page.title }} - {{ site.data.profile.navbar_name }}">
    <meta property="og:description" content="{{ site.data.profile.primary_name }} — {{ site.data.profile.hero_summary | strip_newlines | strip }}">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%231a1a1a'/%3E%3Ctext x='32' y='43' font-family='Menlo,monospace' font-size='30' fill='%23ffffff' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
</head>
<body>
    {% include navbar.html %}
    <main class="container{% if page.container_class %} {{ page.container_class }}{% endif %}">
        {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/language_switcher.js' | relative_url }}"></script>
</body>
</html>
