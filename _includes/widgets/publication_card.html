{% assign publications = include.publications %}
<section class="home-section">
    <div class="home-section-heading d-flex align-items-baseline">
        <div>
            <span class="lang-en">Selected Publications</span>
            <span class="lang-zh d-none">精选论文</span>
        </div>
        <a class="home-inline-link ml-auto" href="{{ 'publications' | relative_url }}">
            <span class="lang-en">All publications</span>
            <span class="lang-zh d-none">全部论文</span>
        </a>
    </div>
    <div class="pub-list">
        {% for item in publications limit:include.limit %}
            {% include widgets/publication_item.html item=item %}
        {% endfor %}
    </div>
</section>
