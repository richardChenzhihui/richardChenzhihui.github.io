{% assign publications = include.publications %}
<section class="section" id="publications">
    <h2 class="section-head">
        <span>
            <span class="lang-en">Selected Publications</span>
            <span class="lang-zh d-none">精选论文</span>
        </span>
        <a href="{{ 'publications' | relative_url }}">
            <span class="lang-en">All publications &rarr;</span>
            <span class="lang-zh d-none">全部论文 &rarr;</span>
        </a>
    </h2>
    <div class="pub-list">
        {% for item in publications limit:include.limit %}
            {% include widgets/publication_item.html item=item hide_abstract=include.hide_abstract %}
        {% endfor %}
    </div>
</section>
