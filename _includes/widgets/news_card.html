{% assign recent_news = site.news | sort: "date" | reverse | slice: 0, include.limit -%}
<section class="section">
    <h2 class="section-head">
        <span class="lang-en">News</span>
        <span class="lang-zh d-none">近期动态</span>
    </h2>
    <div class="news-list">
        {% for item in recent_news %}
        <div class="news-row">
            <div class="news-date">{{ item.date | date: "%b %Y" }}</div>
            <div class="news-title" data-en="{{ item.title }}" data-zh="{{ item.title_zh }}">{{ item.title }}</div>
        </div>
        {% endfor %}
    </div>
</section>
