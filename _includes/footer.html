<footer class="footer">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="d-flex flex-wrap justify-content-between">
            <div>
                <span class="lang-en">{{ site.data.profile.primary_name }} &nbsp;·&nbsp; Updated {{ "now" | date: "%b %Y" }}</span>
                <span class="lang-zh d-none">{{ site.data.profile_zh.primary_name }} &nbsp;·&nbsp; 更新于 {{ "now" | date: "%Y 年 %-m 月" }}</span>
            </div>
            <div>{{ site.data.display.footer_text }}</div>
        </div>
    </div>
</footer>
